services:
  bot:
    build:
      context: .
      target: runtime
    env_file: .env
    restart: unless-stopped
    # Mini App endpoint, only for Caddy on the same host (HTTPS is terminated there)
    ports:
      - "127.0.0.1:8095:8095"
    # PDF rendering and ffmpeg peak here; the VPS has ~2 GB RAM shared with other bots
    mem_limit: 400m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp:size=200m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
